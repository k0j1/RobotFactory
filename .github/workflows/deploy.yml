name: Deploy to CoreServer

on:
  push:
    branches:
      - main # mainブランチにプッシュされた時に自動実行されます

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Build Project
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        
      # GitHub Secretsからデータベース設定ファイル(config.php)を動的に生成します。
      # これにより、GitHub上のソースコードにパスワードを公開せずに済みます。
      - name: Generate DB Config
        run: |
          cat << 'EOF' > dist/api/config.php
          <?php
          define('DB_HOST', 'localhost');
          define('DB_NAME', '${{ secrets.DB_NAME }}');
          define('DB_USER', '${{ secrets.DB_USER }}');
          define('DB_PASS', '${{ secrets.DB_PASSWORD }}');
          EOF
          
      # Viteの仕様により、public/api 配下のPHPファイルはそのまま dist/api にコピーされます。
      # そのため、distフォルダをまるごとCoreServerにアップロードすれば完了です。
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ # ビルド後のファイル
          server-dir: / # CoreServer上の公開ディレクトリのルートパス
          
      # アップロード完了後、DBマイグレーション（テーブル作成）用のPHPを叩いてDB構成を更新します
      - name: Run DB Setup Migration
        run: |
          # setup.phpを叩き、HTTPステータスコードをチェックします。エラーの場合はアクションを失敗(Fail)させます。
          echo "Running Database Migration..."
          RESPONSE=$(curl -s -w "\n%{http_code}" "https://robotfactory.k0j1.v2002.coreserver.jp/api/setup.php")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Status Code: $HTTP_STATUS"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Database setup failed with status $HTTP_STATUS"
            exit 1
          fi
          
          # 200 OKでも中身がエラー(例: {"error": "..."})の場合は失敗させる
          if echo "$BODY" | grep -q '"error"'; then
            echo "Error: Database setup returned an error inside the response"
            exit 1
          fi
          
          echo "Database migration completed successfully."
