name: Build Android APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore Signing Keystore from GitHub Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Restoring Android Signing Keystore from GitHub Secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > assets/ponkotsu-consistent.keystore
          else
            echo "Notice: ANDROID_KEYSTORE_BASE64 secret is not set. Generating fallback keystore..."
            keytool -genkeypair -v \
              -keystore assets/ponkotsu-consistent.keystore \
              -storepass "${ANDROID_KEYSTORE_PASSWORD:-android}" \
              -alias "${ANDROID_KEY_ALIAS:-androiddebugkey}" \
              -keypass "${ANDROID_KEY_PASSWORD:-android}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Ponkotsu Robot Factory,OU=Mobile,O=TakaharaBooks,L=Tokyo,ST=Tokyo,C=JP"
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets (Vite + PWA)
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Add or Sync Capacitor Android Platform
        run: |
          # Android APK内に生のPHPファイル（dist/api/*.php）が同梱されるのを防止（APIは常にCoreServerへ通信）
          rm -rf dist/api
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Android Native Icons & Splash Screens
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/generate-capacitor-assets.mjs
          npx capacitor-assets generate --android --iconBackgroundColor '#1c1917' --iconBackgroundColorDark '#0c0a09' --splashBackgroundColor '#1c1917' --splashBackgroundColorDark '#0c0a09'
          node scripts/configure-android-deeplink.mjs

      - name: Grant Execute Permission for Gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Debug & Release APK / AAB
        working-directory: ./android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease

      - name: Clean Up Temporary Keystore Files
        if: always()
        run: |
          rm -f assets/ponkotsu-consistent.keystore
          rm -f android/app/ponkotsu-consistent.keystore

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponkotsu-robot-factory-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Android Release APK & AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponkotsu-robot-factory-release-bundle
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
