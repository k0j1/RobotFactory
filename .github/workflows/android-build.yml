name: Build Android APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 毎回異なる署名鍵でAPKが生成されて上書き更新（アップデート）に失敗するのを防ぐため、
      # 固定の署名キーストア（assets/ponkotsu-consistent.keystore）をGitHub Actionsキャッシュで永続化・共有します。
      - name: Cache Persistent Android Signing Keystore
        uses: actions/cache@v4
        with:
          path: assets/ponkotsu-consistent.keystore
          key: ponkotsu-android-signing-keystore-v1

      - name: Ensure Persistent Keystore Exists
        run: |
          if [ ! -f "assets/ponkotsu-consistent.keystore" ]; then
            keytool -genkeypair -v \
              -keystore assets/ponkotsu-consistent.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Ponkotsu Robot Factory,O=RobotFactory,C=JP"
          fi

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets (Vite + PWA)
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Add or Sync Capacitor Android Platform
        run: |
          # Android APK内に生のPHPファイル（dist/api/*.php）が同梱されるのを防止（APIは常にCoreServerへ通信）
          rm -rf dist/api
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Android Native Icons & Splash Screens
        run: |
          node scripts/generate-capacitor-assets.mjs
          npx capacitor-assets generate --android --iconBackgroundColor '#1c1917' --iconBackgroundColorDark '#0c0a09' --splashBackgroundColor '#1c1917' --splashBackgroundColorDark '#0c0a09'
          node scripts/configure-android-deeplink.mjs

      - name: Grant Execute Permission for Gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponkotsu-robot-factory-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
