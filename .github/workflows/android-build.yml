name: Build Android APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets (Vite + PWA)
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Add or Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Android Native Icons & Splash Screens
        run: |
          node scripts/generate-capacitor-assets.mjs
          npx capacitor-assets generate --android --iconBackgroundColor '#1c1917' --iconBackgroundColorDark '#0c0a09' --splashBackgroundColor '#1c1917' --splashBackgroundColorDark '#0c0a09'

      - name: Grant Execute Permission for Gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponkotsu-robot-factory-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
